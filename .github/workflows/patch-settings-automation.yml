name: Patch settings automation
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[settings-automation-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert automation card
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/routes/settings.tsx')
          s = p.read_text()
          imp = 'import { ResultsAutomationCard } from "@/components/ResultsAutomationCard";\n'
          if 'ResultsAutomationCard' not in s:
              marker = 'import { getEngineSettings, setDataEngine, setSportKeys, setOddsApiKeysList } from "@/lib/engine-settings.functions";\n'
              if marker not in s:
                  raise SystemExit('settings import marker not found')
              s = s.replace(marker, marker + imp, 1)
          marker = '      <DataEngineCard />'
          if '<ResultsAutomationCard />' not in s:
              if marker not in s:
                  raise SystemExit('settings JSX marker not found')
              s = s.replace(marker, '      <ResultsAutomationCard />\n\n' + marker, 1)
          p.write_text(s)
          PY
      - name: Commit patch and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/routes/settings.tsx .github/workflows/patch-settings-automation.yml
          git rm .github/workflows/patch-settings-automation.yml
          git commit -m 'feat: expose results automation in settings [settings-automation-patched]'
          git push
